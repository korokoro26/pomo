<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- モバイル対応 & safe-area-inset 対応 & ダブルタップズーム防止 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>FocusTimer - ポモドーロタイマー</title>
  
  <!-- Apple HIG / iOS WebApp 関連メタタグ -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FocusTimer">
  
  <!-- Single File PWA 用 Web App Manifest (Data URI) -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"FocusTimer","short_name":"FocusTimer","start_url":".","display":"standalone","background_color":"#F2F2F7","theme_color":"#007AFF","icons":[{"src":"data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22 width=%22192%22 height=%22192%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%23007AFF%22/><text x=%2250%25%22 y=%2255%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-size=%22100%22 fill=%22white%22>⏱</text></svg>","sizes":"192x192","type":"image/svg+xml"}]}'>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Apple HIG 準拠のフォントスタックと基本スタイル */
    :root {
      --system-bg: #F2F2F7;
      --card-bg: #FFFFFF;
      --accent: #007AFF;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: var(--system-bg);
      color: #1C1C1E;
      /* スマホ特有のダブルタップズームや誤選択の無効化 */
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      /* iPhoneノッチ・ホームバー対応 */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    input, textarea {
      -webkit-user-select: text;
      user-select: text;
    }
    /* HIG推奨 最小44pxタップ領域 */
    .touch-target {
      min-height: 44px;
      min-width: 44px;
    }
    /* モーダル背景ブラー (iOSライク) */
    .ios-backdrop {
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4">

  <!-- メインコンテナ -->
  <div class="w-full max-w-md mx-auto flex-1 flex flex-col justify-between pt-4 pb-2">
    
    <!-- ヘッダー -->
    <header class="flex justify-between items-center px-2 mb-4">
      <div class="flex items-center gap-2">
        <i data-lucide="clock" class="text-blue-500 w-6 h-6"></i>
        <h1 class="text-xl font-bold tracking-tight text-gray-900">FocusTimer</h1>
      </div>
      <div class="flex items-center gap-1">
        <!-- 設定モーダルを開くボタン -->
        <button id="btnOpenSettingsModal" class="touch-target flex items-center justify-center p-2 rounded-full text-gray-500 hover:bg-gray-100 active:scale-95 transition-all">
          <i data-lucide="settings" class="w-6 h-6"></i>
        </button>
        <button id="btnOpenAddModal" class="touch-target flex items-center justify-center p-2 rounded-full text-blue-500 hover:bg-blue-50 active:scale-95 transition-all">
          <i data-lucide="plus-circle" class="w-6 h-6"></i>
        </button>
      </div>
    </header>

    <!-- タイマー表示カード -->
    <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 flex flex-col items-center mb-4">
      <!-- モード切り替えタブ -->
      <div class="flex bg-gray-100 p-1 rounded-full mb-3 w-full max-w-xs">
        <button id="btnModeWork" class="flex-1 py-1.5 text-xs font-semibold rounded-full bg-white shadow-sm text-gray-900 transition-all touch-target">作業</button>
        <button id="btnModeShort" class="flex-1 py-1.5 text-xs font-semibold rounded-full text-gray-500 hover:text-gray-900 transition-all touch-target">小休憩</button>
        <button id="btnModeLong" class="flex-1 py-1.5 text-xs font-semibold rounded-full text-gray-500 hover:text-gray-900 transition-all touch-target">長休憩</button>
      </div>

      <!-- 現在のサイクル・セット数の進捗バッジ -->
      <div class="mb-3 px-3 py-1 bg-gray-50 rounded-full border border-gray-200/60 text-[11px] font-medium text-gray-500 flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-blue-500 animate-pulse"></span>
        <span id="cycleStatusDisplay">セット 1 / 4</span>
      </div>

      <!-- タイマーリング & カウント表示 -->
      <div class="relative w-56 h-56 flex items-center justify-center mb-6">
        <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="45" stroke="#E5E5EA" stroke-width="6" fill="transparent" />
          <circle id="timerProgress" cx="50" cy="50" r="45" stroke="#007AFF" stroke-width="6" fill="transparent"
                  stroke-linecap="round" stroke-dasharray="282.74" stroke-dashoffset="0" class="transition-all duration-300" />
        </svg>
        <div class="absolute flex flex-col items-center">
          <span id="timeDisplay" class="text-5xl font-extrabold tracking-tighter text-gray-900 tabular-nums">25:00</span>
          <span id="activeTaskName" class="text-xs font-medium text-gray-400 mt-1 max-w-[140px] truncate">タスク未選択</span>
        </div>
      </div>

      <!-- 操作ボタン群 -->
      <div class="flex items-center gap-4">
        <button id="btnReset" class="touch-target p-3 text-gray-400 hover:text-gray-600 active:scale-95 transition-all">
          <i data-lucide="rotate-ccw" class="w-6 h-6"></i>
        </button>
        <button id="btnToggle" class="touch-target px-8 py-3 bg-blue-500 hover:bg-blue-600 text-white font-semibold rounded-full shadow active:scale-95 transition-all flex items-center gap-2">
          <i id="toggleIcon" data-lucide="play" class="w-5 h-5 fill-current"></i>
          <span id="toggleText">スタート</span>
        </button>
        <button id="btnSkip" class="touch-target p-3 text-gray-400 hover:text-gray-600 active:scale-95 transition-all">
          <i data-lucide="skip-forward" class="w-6 h-6"></i>
        </button>
      </div>
    </div>

    <!-- タスクリスト (CRUD機能) -->
    <div class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 flex-1 flex flex-col overflow-hidden">
      <h2 class="text-sm font-semibold text-gray-400 mb-3 px-1 uppercase tracking-wider">タスク一覧</h2>
      <div id="taskList" class="overflow-y-auto space-y-2 flex-1 pr-1">
        <!-- JSにより動的生成 -->
      </div>
    </div>

  </div>

  <!-- バージョン表示 (更新に伴いインクリメント) -->
  <div class="text-[10px] text-gray-300 select-none pb-1">
    v1.0.3
  </div>

  <!-- 設定モーダル（長休憩までのセット数を任意設定可能） -->
  <div id="settingsModal" class="fixed inset-0 bg-black/30 ios-backdrop z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden opacity-0 transition-opacity duration-200">
    <div id="settingsModalContent" class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-xl transform transition-transform duration-200 translate-y-full sm:translate-y-0">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-gray-900">タイマー設定</h3>
        <button id="btnCloseSettingsModal" class="touch-target text-gray-400 hover:text-gray-600 flex items-center justify-center">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div>
        <div class="mb-5">
          <label class="block text-xs font-semibold text-gray-500 mb-2" for="setsInput">長休憩までの作業セット数</label>
          <div class="flex items-center gap-3">
            <input type="number" id="setsInput" min="1" max="16" value="4"
                   class="w-24 px-3 py-2 border border-gray-200 rounded-xl text-center font-bold text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <span class="text-xs text-gray-500">回作業後に長休憩へ移行</span>
          </div>
          <span class="text-[11px] text-gray-400 mt-1 block">※ 1〜16の範囲でセット数を設定できます</span>
        </div>
        <div class="flex gap-2">
          <button type="button" id="btnCancelSettings" class="touch-target flex-1 py-2.5 rounded-xl border border-gray-200 text-sm font-medium text-gray-600 active:bg-gray-50 transition-colors">キャンセル</button>
          <button type="button" id="btnSaveSettings" class="touch-target flex-1 py-2.5 rounded-xl bg-blue-500 text-sm font-medium text-white hover:bg-blue-600 active:scale-98 transition-all">保存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- タスク追加 / 編集 モーダル -->
  <div id="taskModal" class="fixed inset-0 bg-black/30 ios-backdrop z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden opacity-0 transition-opacity duration-200">
    <div id="modalContent" class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-xl transform transition-transform duration-200 translate-y-full sm:translate-y-0">
      <div class="flex justify-between items-center mb-4">
        <h3 id="modalTitle" class="text-lg font-bold text-gray-900">新規タスク追加</h3>
        <button id="btnCloseModal" class="touch-target text-gray-400 hover:text-gray-600 flex items-center justify-center">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <form id="taskForm" onsubmit="event.preventDefault();">
        <input type="hidden" id="editTaskId" value="">
        <div class="mb-4">
          <label class="block text-xs font-semibold text-gray-500 mb-1" for="taskInput">タスク名</label>
          <textarea id="taskInput" rows="2" placeholder="実行するタスクを入力 (Shift + Enter で保存)"
                    class="w-full px-3 py-2 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm resize-none"></textarea>
          <span class="text-[11px] text-gray-400 mt-1 block">※「Shift + Enter」または保存ボタンで送信</span>
        </div>
        <div class="flex gap-2">
          <button type="button" id="btnCancelModal" class="touch-target flex-1 py-2.5 rounded-xl border border-gray-200 text-sm font-medium text-gray-600 active:bg-gray-50 transition-colors">キャンセル</button>
          <button type="button" id="btnSaveTask" class="touch-target flex-1 py-2.5 rounded-xl bg-blue-500 text-sm font-medium text-white hover:bg-blue-600 active:scale-98 transition-all">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    /* ==========================================================================
       IndexedDB 管理 (データ永続化)
       ========================================================================== */
    const DB_NAME = 'FocusTimerDB';
    const DB_VERSION = 2;
    const STORE_NAME = 'tasks';
    const SETTINGS_STORE = 'settings';
    let db = null;

    /**
     * IndexedDBの初期化
     * ※初学者向け解説:
     * IndexedDBはブラウザ内のNoSQLデータベースです。
     * onupgradeneeded イベントでテーブル（オブジェクトストア）を作成し、
     * 既存のデータストアを消去しないようチェックを行っています。
     */
    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains(STORE_NAME)) {
            database.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
          if (!database.objectStoreNames.contains(SETTINGS_STORE)) {
            database.createObjectStore(SETTINGS_STORE, { keyPath: 'key' });
          }
        };
        request.onsuccess = (e) => {
          db = e.target.result;
          resolve(db);
        };
        request.onerror = (e) => {
          showAlert('IndexedDBの接続に失敗しました: ' + e.target.error);
          reject(e.target.error);
        };
      });
    }

    /**
     * 全タスクの取得 (Read)
     */
    function getAllTasks() {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => {
          showAlert('データの取得に失敗しました');
          reject(req.error);
        };
      });
    }

    /**
     * タスクの保存または更新 (Create / Update)
     */
    function putTask(task) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const req = store.put(task);
        req.onsuccess = () => resolve();
        req.onerror = () => {
          showAlert('タスクの保存に失敗しました');
          reject(req.error);
        };
      });
    }

    /**
     * タスクの削除 (Delete)
     */
    function deleteTaskFromDB(id) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const req = store.delete(id);
        req.onsuccess = () => resolve();
        req.onerror = () => {
          showAlert('タスクの削除に失敗しました');
          reject(req.error);
        };
      });
    }

    /**
     * 設定値の取得 (Read Settings)
     */
    function getSetting(key, defaultValue) {
      return new Promise((resolve) => {
        try {
          const tx = db.transaction(SETTINGS_STORE, 'readonly');
          const store = tx.objectStore(SETTINGS_STORE);
          const req = store.get(key);
          req.onsuccess = () => {
            resolve(req.result ? req.result.value : defaultValue);
          };
          req.onerror = () => resolve(defaultValue);
        } catch (e) {
          resolve(defaultValue);
        }
      });
    }

    /**
     * 設定値の保存 (Save Settings)
     */
    function saveSetting(key, value) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(SETTINGS_STORE, 'readwrite');
        const store = tx.objectStore(SETTINGS_STORE);
        const req = store.put({ key, value });
        req.onsuccess = () => resolve();
        req.onerror = () => {
          showAlert('設定の保存に失敗しました');
          reject(req.error);
        };
      });
    }

    /* ==========================================================================
       エラー可視化・UI通知
       ========================================================================== */
    function showAlert(msg) {
      alert('【エラー / 通知】\n' + msg);
    }

    /* ==========================================================================
       通知音 (Web Audio API) & Web Worker (バックグラウンド動作)
       ========================================================================== */
    /**
     * Web Audio API による終了ビープ音の生成
     * ※初学者向け解説:
     * 外部音声ファイルを持たずとも、ブラウザ標準の音声合成で明瞭なアラート音を再生できます。
     */
    function playBeepSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        // 2段階のピピ音を合成
        osc.frequency.setValueAtTime(880, ctx.currentTime); // A5音
        osc.frequency.setValueAtTime(1174.66, ctx.currentTime + 0.15); // D6音

        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.5);
      } catch (err) {
        console.warn('Audio Context error:', err);
      }
    }

    /**
     * Web Worker の生成 (Single File PWA 準拠の Data URI 方式)
     * ※初学者向け解説:
     * モバイルブラウザやタブがバックグラウンドに回ると setInterval が省電力で間引き停止されます。
     * バックグラウンドスレッドである Web Worker を用いることで、画面消灯・別タブ時も正確に毎秒トリガーを受信します。
     */
    const workerBlobCode = `
      let timer = null;
      self.onmessage = function(e) {
        if (e.data === 'start') {
          if (!timer) {
            timer = setInterval(() => postMessage('tick'), 1000);
          }
        } else if (e.data === 'stop') {
          if (timer) {
            clearInterval(timer);
            timer = null;
          }
        }
      };
    `;
    const workerBlob = new Blob([workerBlobCode], { type: 'application/javascript' });
    const timerWorker = new Worker(URL.createObjectURL(workerBlob));

    /* ==========================================================================
       タイマーロジック & セット数管理
       【アプデ】絶対時刻（Target End Time）方式による画面消灯・バックグラウンド完全追従
       ========================================================================== */
    const MODES = {
      work: { name: '作業', duration: 25 * 60 },
      short: { name: '小休憩', duration: 5 * 60 },
      long: { name: '長休憩', duration: 15 * 60 }
    };
    let currentMode = 'work';
    let timeLeft = MODES.work.duration;
    let targetEndTime = null; // 【重要】タイマー完了予定の絶対時刻 (Date.now() + 残りミリ秒)
    let isRunning = false;
    let activeTaskId = null;
    
    let targetWorkSets = 4;
    let completedWorkSets = 0;

    const CIRCLE_CIRCUMFERENCE = 2 * Math.PI * 45; // r=45

    const timeDisplay = document.getElementById('timeDisplay');
    const timerProgress = document.getElementById('timerProgress');
    const btnToggle = document.getElementById('btnToggle');
    const toggleIcon = document.getElementById('toggleIcon');
    const toggleText = document.getElementById('toggleText');
    const btnReset = document.getElementById('btnReset');
    const btnSkip = document.getElementById('btnSkip');
    const activeTaskName = document.getElementById('activeTaskName');
    const cycleStatusDisplay = document.getElementById('cycleStatusDisplay');

    const btnModeWork = document.getElementById('btnModeWork');
    const btnModeShort = document.getElementById('btnModeShort');
    const btnModeLong = document.getElementById('btnModeLong');

    /**
     * サイクル進捗表示の更新
     */
    function updateCycleDisplay() {
      const currentSetDisplay = (completedWorkSets % targetWorkSets) + 1;
      cycleStatusDisplay.textContent = `セット ${currentSetDisplay} / ${targetWorkSets}`;
    }

    /**
     * タイマーUIの描画更新
     */
    function updateTimerDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      timeDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      
      const total = MODES[currentMode].duration;
      const fraction = (total - timeLeft) / total;
      const offset = CIRCLE_CIRCUMFERENCE * (1 - fraction);
      timerProgress.style.strokeDashoffset = offset;
    }

    /**
     * モード切り替え
     */
    function setMode(mode) {
      if (isRunning) toggleTimer();
      currentMode = mode;
      timeLeft = MODES[mode].duration;
      targetEndTime = null;
      
      [btnModeWork, btnModeShort, btnModeLong].forEach(btn => {
        btn.classList.remove('bg-white', 'shadow-sm', 'text-gray-900');
        btn.classList.add('text-gray-500');
      });
      if (mode === 'work') btnModeWork.classList.add('bg-white', 'shadow-sm', 'text-gray-900');
      if (mode === 'short') btnModeShort.classList.add('bg-white', 'shadow-sm', 'text-gray-900');
      if (mode === 'long') btnModeLong.classList.add('bg-white', 'shadow-sm', 'text-gray-900');
      
      updateTimerDisplay();
      updateCycleDisplay();
    }

    /**
     * タイマー完了時の共通処理
     */
    function onTimerComplete() {
      timerWorker.postMessage('stop');
      isRunning = false;
      targetEndTime = null;
      toggleText.textContent = 'スタート';
      toggleIcon.setAttribute('data-lucide', 'play');
      lucide.createIcons();

      // 通知音 & Web Notification
      playBeepSound();
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification('FocusTimer', {
          body: `${MODES[currentMode].name}が終了しました！`,
          icon: 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22 width=%22192%22 height=%22192%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%23007AFF%22/><text x=%2250%25%22 y=%2255%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-size=%22100%22 fill=%22white%22>⏱</text></svg>'
        });
      }

      if (currentMode === 'work') {
        if (activeTaskId) {
          incrementTaskCount(activeTaskId);
        }
        completedWorkSets++;
        showAlert('作業セッションが終了しました！');
        if (completedWorkSets % targetWorkSets === 0) {
          setMode('long');
        } else {
          setMode('short');
        }
      } else {
        showAlert(`${MODES[currentMode].name}が終了しました！次の作業に移りましょう。`);
        setMode('work');
      }
    }

    /**
     * 毎秒のタイマー更新処理（絶対時刻と突合）
     */
    function tickTimer() {
      if (!isRunning || !targetEndTime) return;

      const remainingMs = targetEndTime - Date.now();
      if (remainingMs <= 0) {
        timeLeft = 0;
        updateTimerDisplay();
        onTimerComplete();
      } else {
        timeLeft = Math.ceil(remainingMs / 1000);
        updateTimerDisplay();
      }
    }

    // Web Workerからのtick受信で更新
    timerWorker.onmessage = function(e) {
      if (e.data === 'tick') {
        tickTimer();
      }
    };

    /**
     * 【スマホ画面復帰・タブ復帰の対応】
     * 画面消灯やバックグラウンドから復帰した瞬間に即座に残り時間を計算・同期
     */
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && isRunning && targetEndTime) {
        tickTimer();
      }
    });

    /**
     * タイマー開始/停止の切り替え
     */
    function toggleTimer() {
      // 初回タップ時に通知権限をリクエスト
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }

      if (isRunning) {
        // 一時停止
        timerWorker.postMessage('stop');
        isRunning = false;
        targetEndTime = null;
        toggleText.textContent = 'スタート';
        toggleIcon.setAttribute('data-lucide', 'play');
      } else {
        // 開始
        isRunning = true;
        targetEndTime = Date.now() + timeLeft * 1000;
        toggleText.textContent = '一時停止';
        toggleIcon.setAttribute('data-lucide', 'pause');
        timerWorker.postMessage('start');
      }
      lucide.createIcons();
    }

    btnToggle.addEventListener('click', toggleTimer);
    btnReset.addEventListener('click', () => {
      if (isRunning) toggleTimer();
      timeLeft = MODES[currentMode].duration;
      targetEndTime = null;
      updateTimerDisplay();
    });
    btnSkip.addEventListener('click', () => {
      if (isRunning) toggleTimer();
      if (currentMode === 'work') {
        completedWorkSets++;
        if (completedWorkSets % targetWorkSets === 0) {
          setMode('long');
        } else {
          setMode('short');
        }
      } else {
        setMode('work');
      }
    });

    btnModeWork.addEventListener('click', () => setMode('work'));
    btnModeShort.addEventListener('click', () => setMode('short'));
    btnModeLong.addEventListener('click', () => setMode('long'));

    /* ==========================================================================
       タスク CRUD 管理
       ========================================================================== */
    const taskList = document.getElementById('taskList');
    const taskModal = document.getElementById('taskModal');
    const modalContent = document.getElementById('modalContent');
    const taskInput = document.getElementById('taskInput');
    const editTaskId = document.getElementById('editTaskId');
    const modalTitle = document.getElementById('modalTitle');
    const btnOpenAddModal = document.getElementById('btnOpenAddModal');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const btnCancelModal = document.getElementById('btnCancelModal');
    const btnSaveTask = document.getElementById('btnSaveTask');

    /**
     * タスクリストの再描画 (Read)
     */
    async function renderTasks() {
      const tasks = await getAllTasks();
      taskList.innerHTML = '';
      
      if (tasks.length === 0) {
        taskList.innerHTML = '<div class="text-center py-6 text-xs text-gray-400">タスクがありません。<br>右上の「＋」から追加してください。</div>';
        activeTaskId = null;
        activeTaskName.textContent = 'タスク未選択';
        return;
      }

      tasks.forEach(task => {
        const item = document.createElement('div');
        const isSelected = task.id === activeTaskId;
        item.id = `task-card-${task.id}`;
        item.className = `p-3 rounded-2xl border transition-all duration-300 flex items-center justify-between gap-2 ${
          isSelected ? 'border-blue-500 bg-blue-50/50 ring-1 ring-blue-500' : 'border-gray-100 bg-gray-50/60'
        }`;

        // 完了チェックボタンをクリックで完了アニメーション後に自動消去
        item.innerHTML = `
          <div class="flex items-center gap-2 flex-1 min-w-0">
            <button onclick="event.stopPropagation(); completeAndAutoDelete('${task.id}')" 
                    title="完了して消去"
                    class="touch-target w-8 h-8 rounded-full border-2 border-gray-300 hover:border-green-500 hover:bg-green-50 flex items-center justify-center text-transparent hover:text-green-500 active:scale-90 transition-all flex-shrink-0">
              <i data-lucide="check" class="w-4 h-4 stroke-[3]"></i>
            </button>
            <div class="flex-1 min-w-0 cursor-pointer" onclick="selectTask('${task.id}')">
              <div class="flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full flex-shrink-0 ${isSelected ? 'bg-blue-500' : 'bg-transparent border border-gray-300'}"></span>
                <span class="text-sm font-medium text-gray-800 truncate block">${escapeHtml(task.title)}</span>
              </div>
              <span class="text-[11px] text-gray-400 block pl-3.5">完了: ${task.pomodoros || 0} ポモドーロ</span>
            </div>
          </div>
          <div class="flex items-center gap-1 flex-shrink-0">
            <button onclick="openEditModal('${task.id}')" class="touch-target p-2 text-gray-400 hover:text-blue-500 active:scale-95 transition-all">
              <i data-lucide="edit-2" class="w-4 h-4"></i>
            </button>
            <button onclick="confirmDelete('${task.id}')" class="touch-target p-2 text-gray-400 hover:text-red-500 active:scale-95 transition-all">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
        `;
        taskList.appendChild(item);
      });

      // アクティブタスク表示の更新
      const current = tasks.find(t => t.id === activeTaskId);
      activeTaskName.textContent = current ? current.title : 'タスク未選択';
      lucide.createIcons();
    }

    /**
     * タスクに完了マークをつけたら自動消去する機能
     */
    window.completeAndAutoDelete = async (id) => {
      const card = document.getElementById(`task-card-${id}`);
      if (card) {
        // 完了アニメーション（フェードアウト＆右スライド）
        card.classList.add('opacity-0', 'translate-x-6', 'bg-green-50');
      }
      setTimeout(async () => {
        await deleteTaskFromDB(id);
        if (activeTaskId === id) {
          activeTaskId = null;
        }
        await renderTasks();
      }, 300);
    };

    /**
     * タスク選択
     */
    window.selectTask = (id) => {
      activeTaskId = (activeTaskId === id) ? null : id;
      renderTasks();
    };

    /**
     * ポモドーロ完了回数加算
     */
    async function incrementTaskCount(id) {
      const tasks = await getAllTasks();
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.pomodoros = (task.pomodoros || 0) + 1;
        await putTask(task);
        renderTasks();
      }
    }

    /**
     * 削除確認 & 削除処理 (Delete)
     */
    window.confirmDelete = async (id) => {
      if (confirm('このタスクを削除してもよろしいですか？')) {
        await deleteTaskFromDB(id);
        if (activeTaskId === id) activeTaskId = null;
        renderTasks();
      }
    };

    /* ==========================================================================
       モーダル & フォーム制御 (Shift + Enter送信、外側クリック対応)
       ========================================================================== */
    function showModal() {
      taskModal.classList.remove('hidden');
      setTimeout(() => {
        taskModal.classList.remove('opacity-0');
        modalContent.classList.remove('translate-y-full');
      }, 10);
      taskInput.focus();
    }

    function hideModal() {
      taskModal.classList.add('opacity-0');
      modalContent.classList.add('translate-y-full');
      setTimeout(() => {
        taskModal.classList.add('hidden');
        taskInput.value = '';
        editTaskId.value = '';
      }, 200);
    }

    // モーダル外タップで閉じる処理
    taskModal.addEventListener('click', (e) => {
      if (e.target === taskModal) {
        hideModal();
      }
    });
    btnCloseModal.addEventListener('click', hideModal);
    btnCancelModal.addEventListener('click', hideModal);

    // 新規作成モーダルオープン
    btnOpenAddModal.addEventListener('click', () => {
      modalTitle.textContent = '新規タスク追加';
      editTaskId.value = '';
      taskInput.value = '';
      showModal();
    });

    // 編集モーダルオープン (Update)
    window.openEditModal = async (id) => {
      const tasks = await getAllTasks();
      const task = tasks.find(t => t.id === id);
      if (task) {
        modalTitle.textContent = 'タスクの編集';
        editTaskId.value = task.id;
        taskInput.value = task.title;
        showModal();
      }
    };

    /**
     * 保存処理 (Create / Update)
     */
    async function handleSave() {
      const text = taskInput.value.trim();
      // 入力バリデーション
      if (!text) {
        showAlert('タスク名を入力してください。');
        return;
      }

      const id = editTaskId.value;
      if (id) {
        // 更新 (Update)
        const tasks = await getAllTasks();
        const existing = tasks.find(t => t.id === id);
        if (existing) {
          existing.title = text;
          await putTask(existing);
        }
      } else {
        // 作成 (Create)
        const newTask = {
          id: 'task_' + Date.now(),
          title: text,
          pomodoros: 0,
          completed: false,
          createdAt: new Date().toISOString()
        };
        await putTask(newTask);
      }
      hideModal();
      renderTasks();
    }

    btnSaveTask.addEventListener('click', handleSave);

    // テキストフォームの誤操作防止:「Shift + Enter」で送信、Enter単体は改行
    taskInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.shiftKey) {
        e.preventDefault();
        handleSave();
      }
    });

    /* ==========================================================================
       設定モーダル制御（セット数の任意変更）
       ========================================================================== */
    const settingsModal = document.getElementById('settingsModal');
    const settingsModalContent = document.getElementById('settingsModalContent');
    const btnOpenSettingsModal = document.getElementById('btnOpenSettingsModal');
    const btnCloseSettingsModal = document.getElementById('btnCloseSettingsModal');
    const btnCancelSettings = document.getElementById('btnCancelSettings');
    const btnSaveSettings = document.getElementById('btnSaveSettings');
    const setsInput = document.getElementById('setsInput');

    function openSettingsModal() {
      setsInput.value = targetWorkSets;
      settingsModal.classList.remove('hidden');
      setTimeout(() => {
        settingsModal.classList.remove('opacity-0');
        settingsModalContent.classList.remove('translate-y-full');
      }, 10);
    }

    function hideSettingsModal() {
      settingsModal.classList.add('opacity-0');
      settingsModalContent.classList.add('translate-y-full');
      setTimeout(() => {
        settingsModal.classList.add('hidden');
      }, 200);
    }

    btnOpenSettingsModal.addEventListener('click', openSettingsModal);
    btnCloseSettingsModal.addEventListener('click', hideSettingsModal);
    btnCancelSettings.addEventListener('click', hideSettingsModal);
    settingsModal.addEventListener('click', (e) => {
      if (e.target === settingsModal) hideSettingsModal();
    });

    btnSaveSettings.addEventListener('click', async () => {
      const val = parseInt(setsInput.value, 10);
      if (isNaN(val) || val < 1 || val > 16) {
        showAlert('セット数は1〜16の範囲で指定してください。');
        return;
      }
      targetWorkSets = val;
      await saveSetting('targetWorkSets', targetWorkSets);
      updateCycleDisplay();
      hideSettingsModal();
    });

    // XSSサニタイズ用
    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    /* ==========================================================================
       初期化実行
       ========================================================================== */
    window.addEventListener('DOMContentLoaded', async () => {
      lucide.createIcons();
      updateTimerDisplay();
      await initDB();
      // 保存済み設定の復元（初期値へのリセット防止）
      targetWorkSets = await getSetting('targetWorkSets', 4);
      updateCycleDisplay();
      await renderTasks();
    });
  </script>
</body>
</html>
