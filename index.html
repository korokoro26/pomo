<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>FocusTimer - ポモドーロタイマー</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FocusTimer">
  
  <link rel="manifest" href='data:application/manifest+json,{"name":"FocusTimer","short_name":"FocusTimer","start_url":".","display":"standalone","background_color":"#F2F2F7","theme_color":"#007AFF","icons":[{"src":"data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22 width=%22192%22 height=%22192%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%23007AFF%22/><text x=%2250%25%22 y=%2255%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-size=%22100%22 fill=%22white%22>⏱</text></svg>","sizes":"192x192","type":"image/svg+xml"}]}'>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --system-bg: #F2F2F7;
      --card-bg: #FFFFFF;
      --accent: #007AFF;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: var(--system-bg);
      color: #1C1C1E;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    .touch-target {
      min-height: 44px;
      min-width: 44px;
    }
    .ios-backdrop {
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    @keyframes dotPop {
      0% { transform: scale(0); opacity: 0; }
      70% { transform: scale(1.3); }
      100% { transform: scale(1); opacity: 1; }
    }
    .dot-enter {
      animation: dotPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-3 sm:p-4 relative">

  <!-- 自動遷移通知用トースト -->
  <div id="toastNotification" class="fixed top-5 z-50 transform -translate-y-16 opacity-0 transition-all duration-300 pointer-events-none bg-gray-900/90 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2">
    <i id="toastIcon" data-lucide="bell" class="w-4 h-4 text-rose-400"></i>
    <span id="toastMessage">セッション開始</span>
  </div>

  <div class="w-full max-w-md mx-auto flex-1 flex flex-col justify-between pt-2 pb-2">
    
    <!-- ナビゲーションバー -->
    <header class="flex justify-between items-center px-1 mb-3">
      <div class="flex items-center gap-2">
        <i data-lucide="flame" class="text-rose-500 w-6 h-6"></i>
        <h1 class="text-xl font-bold tracking-tight text-gray-900">FocusTimer</h1>
      </div>
      
      <div class="flex bg-gray-200/80 p-1 rounded-xl">
        <button id="navBtnTimer" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all shadow-sm bg-white text-gray-900 flex items-center gap-1.5 touch-target">
          <i data-lucide="timer" class="w-4 h-4"></i>
          <span>タイマー</span>
        </button>
        <button id="navBtnCalendar" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-600 hover:text-gray-900 transition-all flex items-center gap-1.5 touch-target">
          <i data-lucide="calendar" class="w-4 h-4"></i>
          <span>ログ</span>
        </button>
      </div>

      <button id="btnOpenSettingsModal" class="touch-target flex items-center justify-center p-2 rounded-full text-gray-500 hover:bg-gray-100 active:scale-95 transition-all">
        <i data-lucide="settings" class="w-5 h-5"></i>
      </button>
    </header>

    <!-- VIEW 1: タイマー画面 -->
    <main id="viewTimer" class="flex-1 flex flex-col justify-between">
      
      <div class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 flex flex-col items-center mb-3">
        <!-- モード切り替えタブ -->
        <div class="flex bg-gray-100 p-1 rounded-full mb-3 w-full max-w-xs">
          <button id="btnModeWork" class="flex-1 py-1.5 text-xs font-semibold rounded-full bg-white shadow-sm text-gray-900 transition-all touch-target">作業</button>
          <button id="btnModeShort" class="flex-1 py-1.5 text-xs font-semibold rounded-full text-gray-500 hover:text-gray-900 transition-all touch-target">小休憩</button>
          <button id="btnModeLong" class="flex-1 py-1.5 text-xs font-semibold rounded-full text-gray-500 hover:text-gray-900 transition-all touch-target">長休憩</button>
        </div>

        <!-- サイクル状態 -->
        <div class="mb-3 px-3 py-1 bg-gray-50 rounded-full border border-gray-200/60 text-[11px] font-medium text-gray-500 flex items-center gap-1.5">
          <span id="cycleIndicatorDot" class="w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse"></span>
          <span id="cycleStatusDisplay">セット 1 / 4</span>
        </div>

        <!-- タイマーリング -->
        <div class="relative w-52 h-52 flex items-center justify-center mb-4">
          <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="45" stroke="#F2F2F7" stroke-width="7" fill="transparent" />
            <circle id="timerProgress" cx="50" cy="50" r="45" stroke="#FF2D55" stroke-width="7" fill="transparent"
                    stroke-linecap="round" stroke-dasharray="282.74" stroke-dashoffset="0" class="transition-all duration-300" />
          </svg>
          <div class="absolute flex flex-col items-center">
            <span id="timeDisplay" class="text-5xl font-black tracking-tighter text-gray-900 tabular-nums">25:00</span>
            <span id="currentModeLabel" class="text-xs font-bold text-rose-500 uppercase tracking-widest mt-1">作業中</span>
          </div>
        </div>

        <!-- 操作ボタン群 -->
        <div class="flex items-center gap-5">
          <button id="btnReset" title="リセット" class="touch-target p-3 text-gray-400 hover:text-gray-600 active:scale-90 transition-all">
            <i data-lucide="rotate-ccw" class="w-6 h-6"></i>
          </button>
          <button id="btnToggle" class="touch-target px-9 py-3.5 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-full shadow-lg shadow-rose-200 active:scale-95 transition-all flex items-center gap-2">
            <i id="toggleIcon" data-lucide="play" class="w-5 h-5 fill-current"></i>
            <span id="toggleText">スタート</span>
          </button>
          <button id="btnSkip" title="次へスキップ" class="touch-target p-3 text-gray-400 hover:text-gray-600 active:scale-90 transition-all">
            <i data-lucide="skip-forward" class="w-6 h-6"></i>
          </button>
        </div>
      </div>

      <!-- 本日の累計ポモドーロ -->
      <div class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 flex-1 flex flex-col justify-between min-h-[160px]">
        <div>
          <div class="flex justify-between items-center mb-2 px-1">
            <div class="flex items-center gap-1.5">
              <i data-lucide="award" class="w-4 h-4 text-amber-500"></i>
              <h2 class="text-xs font-bold text-gray-700 uppercase tracking-wider">本日の積み上げ</h2>
            </div>
            <div class="flex items-center gap-2 text-[11px] font-semibold">
              <span class="text-gray-800 font-bold" id="todaySummaryStats">作業 0回 (0分)</span>
            </div>
          </div>

          <div class="flex items-center gap-3 px-1 mb-3 text-[10px] text-gray-400">
            <span class="flex items-center gap-1">
              <span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>作業(25m)
            </span>
            <span class="flex items-center gap-1">
              <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>小休(5m)
            </span>
            <span class="flex items-center gap-1">
              <span class="w-2.5 h-2.5 rounded-full bg-sky-500"></span>長休(15m)
            </span>
          </div>

          <div id="todayDotsContainer" class="flex flex-wrap gap-2.5 p-3.5 bg-gray-50/70 rounded-2xl min-h-[72px] items-center border border-dashed border-gray-200"></div>
        </div>

        <p class="text-[11px] text-center text-gray-400 mt-2">
          ポモドーロを完了するたびにドットが自動で積み上がります
        </p>
      </div>

    </main>

    <!-- VIEW 2: カレンダー履歴画面 -->
    <main id="viewCalendar" class="flex-1 flex flex-col bg-white rounded-3xl p-4 shadow-sm border border-gray-100 hidden">
      <div class="flex justify-between items-center mb-3 px-1">
        <h2 id="calendarMonthYear" class="text-base font-bold text-gray-900 tracking-tight">2026年 10月</h2>
        <div class="flex gap-1">
          <button id="btnPrevMonth" class="touch-target p-2 text-gray-500 hover:bg-gray-100 rounded-full active:scale-90 transition-all">
            <i data-lucide="chevron-left" class="w-5 h-5"></i>
          </button>
          <button id="btnNextMonth" class="touch-target p-2 text-gray-500 hover:bg-gray-100 rounded-full active:scale-90 transition-all">
            <i data-lucide="chevron-right" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-bold text-gray-400 mb-1">
        <div class="text-rose-400">日</div>
        <div>月</div>
        <div>火</div>
        <div>水</div>
        <div>木</div>
        <div>金</div>
        <div class="text-sky-400">土</div>
      </div>

      <div id="calendarGrid" class="grid grid-cols-7 gap-1.5 flex-1 content-start py-1"></div>

      <div id="selectedDayDetail" class="mt-3 p-3 bg-gray-50 rounded-2xl border border-gray-100">
        <div class="flex justify-between items-center mb-1.5">
          <span id="selectedDateTitle" class="text-xs font-bold text-gray-700">本日</span>
          <span id="selectedDateTotal" class="text-xs font-semibold text-rose-500">合計: 0回</span>
        </div>
        <div id="selectedDateDots" class="flex flex-wrap gap-1.5 min-h-[24px] items-center">
          <span class="text-[11px] text-gray-400">ログがありません</span>
        </div>
      </div>
    </main>

  </div>

  <div class="text-[10px] text-gray-300 select-none pb-1">
    v1.2.0
  </div>

  <!-- 設定モーダル -->
  <div id="settingsModal" class="fixed inset-0 bg-black/30 ios-backdrop z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden opacity-0 transition-opacity duration-200">
    <div id="settingsModalContent" class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-xl transform transition-transform duration-200 translate-y-full sm:translate-y-0">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-gray-900">タイマー設定</h3>
        <button id="btnCloseSettingsModal" class="touch-target text-gray-400 hover:text-gray-600 flex items-center justify-center">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div>
        <div class="mb-5">
          <label class="block text-xs font-semibold text-gray-500 mb-2" for="setsInput">長休憩までの作業セット数</label>
          <div class="flex items-center gap-3">
            <input type="number" id="setsInput" min="1" max="16" value="4"
                   class="w-24 px-3 py-2 border border-gray-200 rounded-xl text-center font-bold text-gray-800 focus:outline-none focus:ring-2 focus:ring-rose-500">
            <span class="text-xs text-gray-500">回作業後に長休憩へ移行</span>
          </div>
          <span class="text-[11px] text-gray-400 mt-1 block">※ 1〜16の範囲で設定できます</span>
        </div>
        <div class="flex gap-2">
          <button type="button" id="btnCancelSettings" class="touch-target flex-1 py-2.5 rounded-xl border border-gray-200 text-sm font-medium text-gray-600 active:bg-gray-50 transition-colors">キャンセル</button>
          <button type="button" id="btnSaveSettings" class="touch-target flex-1 py-2.5 rounded-xl bg-rose-500 text-sm font-medium text-white hover:bg-rose-600 active:scale-98 transition-all">保存</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const DB_NAME = 'FocusTimerDB';
    const DB_VERSION = 3;
    const LOGS_STORE = 'pomodoro_logs';
    const SETTINGS_STORE = 'settings';
    let db = null;

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains(LOGS_STORE)) {
            const store = database.createObjectStore(LOGS_STORE, { keyPath: 'id' });
            store.createIndex('dateKey', 'dateKey', { unique: false });
          }
          if (!database.objectStoreNames.contains(SETTINGS_STORE)) {
            database.createObjectStore(SETTINGS_STORE, { keyPath: 'key' });
          }
        };
        request.onsuccess = (e) => {
          db = e.target.result;
          resolve(db);
        };
        request.onerror = (e) => {
          showToast('IndexedDB接続失敗');
          reject(e.target.error);
        };
      });
    }

    function addPomodoroLog(log) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(LOGS_STORE, 'readwrite');
        const store = tx.objectStore(LOGS_STORE);
        const req = store.add(log);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    function getLogsByDate(dateKey) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(LOGS_STORE, 'readonly');
        const store = tx.objectStore(LOGS_STORE);
        const index = store.index('dateKey');
        const req = index.getAll(dateKey);
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    }

    function getLogsForMonth(year, month) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(LOGS_STORE, 'readonly');
        const store = tx.objectStore(LOGS_STORE);
        const req = store.getAll();
        req.onsuccess = () => {
          const prefix = `${year}-${String(month + 1).padStart(2, '0')}`;
          const filtered = (req.result || []).filter(item => item.dateKey.startsWith(prefix));
          resolve(filtered);
        };
        req.onerror = () => reject(req.error);
      });
    }

    function getSetting(key, defaultValue) {
      return new Promise((resolve) => {
        try {
          const tx = db.transaction(SETTINGS_STORE, 'readonly');
          const store = tx.objectStore(SETTINGS_STORE);
          const req = store.get(key);
          req.onsuccess = () => resolve(req.result ? req.result.value : defaultValue);
          req.onerror = () => resolve(defaultValue);
        } catch (e) {
          resolve(defaultValue);
        }
      });
    }

    function saveSetting(key, value) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(SETTINGS_STORE, 'readwrite');
        const store = tx.objectStore(SETTINGS_STORE);
        const req = store.put({ key, value });
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    /* 自動スタートを止めないトースト通知 */
    let toastTimeout = null;
    function showToast(msg) {
      const toast = document.getElementById('toastNotification');
      const toastMsg = document.getElementById('toastMessage');
      toastMsg.textContent = msg;
      
      toast.classList.remove('-translate-y-16', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('-translate-y-16', 'opacity-0');
        toast.classList.remove('translate-y-0', 'opacity-100');
      }, 3000);
    }

    function getLocalDateKey(d = new Date()) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function playBeepSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.setValueAtTime(1174.66, ctx.currentTime + 0.15);

        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.5);
      } catch (err) {
        console.warn('Audio Context error:', err);
      }
    }

    const workerBlobCode = `
      let timer = null;
      self.onmessage = function(e) {
        if (e.data === 'start') {
          if (!timer) {
            timer = setInterval(() => postMessage('tick'), 1000);
          }
        } else if (e.data === 'stop') {
          if (timer) {
            clearInterval(timer);
            timer = null;
          }
        }
      };
    `;
    const workerBlob = new Blob([workerBlobCode], { type: 'application/javascript' });
    const timerWorker = new Worker(URL.createObjectURL(workerBlob));

    const MODES = {
      work: { 
        name: '作業', 
        duration: 25 * 60,
        color: '#FF2D55', 
        dotBg: 'bg-rose-500', 
        label: '作業中'
      },
      short: { 
        name: '小休憩', 
        duration: 5 * 60,
        color: '#34C759', 
        dotBg: 'bg-emerald-400', 
        label: '小休憩中'
      },
      long: { 
        name: '長休憩', 
        duration: 15 * 60,
        color: '#007AFF', 
        dotBg: 'bg-sky-500', 
        label: 'リフレッシュ'
      }
    };

    let currentMode = 'work';
    let timeLeft = MODES.work.duration;
    let targetEndTime = null;
    let isRunning = false;
    let targetWorkSets = 4;
    let completedWorkSets = 0;

    const CIRCLE_CIRCUMFERENCE = 2 * Math.PI * 45;

    const timeDisplay = document.getElementById('timeDisplay');
    const timerProgress = document.getElementById('timerProgress');
    const currentModeLabel = document.getElementById('currentModeLabel');
    const btnToggle = document.getElementById('btnToggle');
    const toggleIcon = document.getElementById('toggleIcon');
    const toggleText = document.getElementById('toggleText');
    const btnReset = document.getElementById('btnReset');
    const btnSkip = document.getElementById('btnSkip');
    const cycleStatusDisplay = document.getElementById('cycleStatusDisplay');
    const cycleIndicatorDot = document.getElementById('cycleIndicatorDot');

    const btnModeWork = document.getElementById('btnModeWork');
    const btnModeShort = document.getElementById('btnModeShort');
    const btnModeLong = document.getElementById('btnModeLong');
    const todayDotsContainer = document.getElementById('todayDotsContainer');
    const todaySummaryStats = document.getElementById('todaySummaryStats');

    function updateCycleDisplay() {
      const currentSetDisplay = (completedWorkSets % targetWorkSets) + 1;
      cycleStatusDisplay.textContent = `セット ${currentSetDisplay} / ${targetWorkSets}`;
    }

    function updateTimerDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      timeDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      
      const total = MODES[currentMode].duration;
      const fraction = timeLeft / total;
      const offset = CIRCLE_CIRCUMFERENCE * (1 - fraction);
      timerProgress.style.strokeDashoffset = offset;
    }

    function setMode(mode, autoStart = false) {
      if (isRunning && !autoStart) toggleTimer();
      currentMode = mode;
      timeLeft = MODES[mode].duration;
      targetEndTime = null;

      timerProgress.setAttribute('stroke', MODES[mode].color);
      currentModeLabel.textContent = MODES[mode].label;
      currentModeLabel.style.color = MODES[mode].color;
      cycleIndicatorDot.style.backgroundColor = MODES[mode].color;
      
      if (mode === 'work') {
        btnToggle.className = 'touch-target px-9 py-3.5 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-full shadow-lg shadow-rose-200 active:scale-95 transition-all flex items-center gap-2';
      } else if (mode === 'short') {
        btnToggle.className = 'touch-target px-9 py-3.5 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-full shadow-lg shadow-emerald-200 active:scale-95 transition-all flex items-center gap-2';
      } else {
        btnToggle.className = 'touch-target px-9 py-3.5 bg-sky-500 hover:bg-sky-600 text-white font-bold rounded-full shadow-lg shadow-sky-200 active:scale-95 transition-all flex items-center gap-2';
      }

      [btnModeWork, btnModeShort, btnModeLong].forEach(btn => {
        btn.classList.remove('bg-white', 'shadow-sm', 'text-gray-900');
        btn.classList.add('text-gray-500');
      });
      if (mode === 'work') btnModeWork.classList.add('bg-white', 'shadow-sm', 'text-gray-900');
      if (mode === 'short') btnModeShort.classList.add('bg-white', 'shadow-sm', 'text-gray-900');
      if (mode === 'long') btnModeLong.classList.add('bg-white', 'shadow-sm', 'text-gray-900');
      
      updateTimerDisplay();
      updateCycleDisplay();

      if (autoStart) {
        startTimer();
      }
    }

    function startTimer() {
      isRunning = true;
      targetEndTime = Date.now() + timeLeft * 1000;
      toggleText.textContent = '一時停止';
      toggleIcon.setAttribute('data-lucide', 'pause');
      timerWorker.postMessage('start');
      lucide.createIcons();
    }

    function pauseTimer() {
      timerWorker.postMessage('stop');
      isRunning = false;
      targetEndTime = null;
      toggleText.textContent = 'スタート';
      toggleIcon.setAttribute('data-lucide', 'play');
      lucide.createIcons();
    }

    /**
     * 【改修】タイマー終了時の自動継続処理
     */
    async function onTimerComplete() {
      playBeepSound();

      // ログ保存
      const finishedMode = currentMode;
      const newLog = {
        id: 'log_' + Date.now(),
        type: finishedMode,
        durationMinutes: Math.round(MODES[finishedMode].duration / 60),
        timestamp: Date.now(),
        dateKey: getLocalDateKey()
      };
      await addPomodoroLog(newLog);

      await renderTodayDots();
      if (currentView === 'calendar') {
        await renderCalendar();
      }

      // 通知送信
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification('FocusTimer', {
          body: `${MODES[finishedMode].name}が終了しました。次のタイマーを自動スタートします。`,
          icon: 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22 width=%22192%22 height=%22192%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%23FF2D55%22/><text x=%2250%25%22 y=%2255%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-size=%22100%22 fill=%22white%22>⏱</text></svg>'
        });
      }

      // 次のモードへ自動移行して即スタート
      if (finishedMode === 'work') {
        completedWorkSets++;
        if (completedWorkSets % targetWorkSets === 0) {
          showToast('作業完了！長休憩を自動開始しました');
          setMode('long', true);
        } else {
          showToast('作業完了！小休憩を自動開始しました');
          setMode('short', true);
        }
      } else {
        showToast('休憩終了！次の作業を自動開始しました');
        setMode('work', true);
      }
    }

    function tickTimer() {
      if (!isRunning || !targetEndTime) return;
      const remainingMs = targetEndTime - Date.now();
      if (remainingMs <= 0) {
        timeLeft = 0;
        updateTimerDisplay();
        onTimerComplete();
      } else {
        timeLeft = Math.ceil(remainingMs / 1000);
        updateTimerDisplay();
      }
    }

    timerWorker.onmessage = (e) => {
      if (e.data === 'tick') tickTimer();
    };

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && isRunning && targetEndTime) {
        tickTimer();
      }
    });

    function toggleTimer() {
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }

      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    btnToggle.addEventListener('click', toggleTimer);
    btnReset.addEventListener('click', () => {
      if (isRunning) pauseTimer();
      timeLeft = MODES[currentMode].duration;
      targetEndTime = null;
      updateTimerDisplay();
    });
    btnSkip.addEventListener('click', () => {
      const wasRunning = isRunning;
      if (currentMode === 'work') {
        completedWorkSets++;
        const nextMode = (completedWorkSets % targetWorkSets === 0) ? 'long' : 'short';
        setMode(nextMode, wasRunning);
      } else {
        setMode('work', wasRunning);
      }
    });

    btnModeWork.addEventListener('click', () => setMode('work'));
    btnModeShort.addEventListener('click', () => setMode('short'));
    btnModeLong.addEventListener('click', () => setMode('long'));

    async function renderTodayDots() {
      const todayKey = getLocalDateKey();
      const logs = await getLogsByDate(todayKey);

      todayDotsContainer.innerHTML = '';

      if (logs.length === 0) {
        todayDotsContainer.innerHTML = `
          <div class="w-full text-center py-2 text-xs text-gray-400">
            今日の完了ドットはまだありません
          </div>
        `;
        todaySummaryStats.textContent = '作業 0回 (0分)';
        return;
      }

      let workCount = 0;
      let totalWorkMinutes = 0;

      logs.forEach((log) => {
        const modeInfo = MODES[log.type] || MODES.work;
        if (log.type === 'work') {
          workCount++;
          totalWorkMinutes += log.durationMinutes || 25;
        }

        const dot = document.createElement('div');
        const formattedTime = new Date(log.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        dot.className = `w-6 h-6 rounded-full ${modeInfo.dotBg} shadow-sm dot-enter cursor-pointer active:scale-75 transition-transform flex items-center justify-center text-[10px] text-white font-bold`;
        dot.title = `${modeInfo.name} (${formattedTime} 完了)`;
        
        if (log.type === 'work') {
          dot.innerHTML = `<span class="opacity-90">•</span>`;
        }

        dot.addEventListener('click', () => {
          showToast(`${modeInfo.name} (${formattedTime} 完了 / ${log.durationMinutes}分)`);
        });

        todayDotsContainer.appendChild(dot);
      });

      todaySummaryStats.textContent = `作業 ${workCount}回 (${totalWorkMinutes}分)`;
    }

    const viewTimer = document.getElementById('viewTimer');
    const viewCalendar = document.getElementById('viewCalendar');
    const navBtnTimer = document.getElementById('navBtnTimer');
    const navBtnCalendar = document.getElementById('navBtnCalendar');

    const calendarMonthYear = document.getElementById('calendarMonthYear');
    const calendarGrid = document.getElementById('calendarGrid');
    const btnPrevMonth = document.getElementById('btnPrevMonth');
    const btnNextMonth = document.getElementById('btnNextMonth');

    const selectedDateTitle = document.getElementById('selectedDateTitle');
    const selectedDateTotal = document.getElementById('selectedDateTotal');
    const selectedDateDots = document.getElementById('selectedDateDots');

    let currentView = 'timer';
    let calendarDate = new Date();
    let currentSelectedDateKey = getLocalDateKey();

    function switchView(view) {
      currentView = view;
      if (view === 'timer') {
        viewTimer.classList.remove('hidden');
        viewCalendar.classList.add('hidden');
        navBtnTimer.className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all shadow-sm bg-white text-gray-900 flex items-center gap-1.5 touch-target';
        navBtnCalendar.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-600 hover:text-gray-900 transition-all flex items-center gap-1.5 touch-target';
      } else {
        viewTimer.classList.add('hidden');
        viewCalendar.classList.remove('hidden');
        navBtnCalendar.className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all shadow-sm bg-white text-gray-900 flex items-center gap-1.5 touch-target';
        navBtnTimer.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-600 hover:text-gray-900 transition-all flex items-center gap-1.5 touch-target';
        renderCalendar();
      }
      lucide.createIcons();
    }

    navBtnTimer.addEventListener('click', () => switchView('timer'));
    navBtnCalendar.addEventListener('click', () => switchView('calendar'));

    btnPrevMonth.addEventListener('click', () => {
      calendarDate.setMonth(calendarDate.getMonth() - 1);
      renderCalendar();
    });
    btnNextMonth.addEventListener('click', () => {
      calendarDate.setMonth(calendarDate.getMonth() + 1);
      renderCalendar();
    });

    async function renderCalendar() {
      const year = calendarDate.getFullYear();
      const month = calendarDate.getMonth();
      
      calendarMonthYear.textContent = `${year}年 ${month + 1}月`;

      const monthLogs = await getLogsForMonth(year, month);
      
      const logMap = {};
      monthLogs.forEach(log => {
        if (!logMap[log.dateKey]) logMap[log.dateKey] = [];
        logMap[log.dateKey].push(log);
      });

      calendarGrid.innerHTML = '';

      const firstDayIndex = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDayIndex; i++) {
        const blank = document.createElement('div');
        blank.className = 'h-14 rounded-xl bg-gray-50/40 opacity-30';
        calendarGrid.appendChild(blank);
      }

      const todayStr = getLocalDateKey();

      for (let day = 1; day <= lastDate; day++) {
        const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayLogs = logMap[dStr] || [];
        const isToday = dStr === todayStr;
        const isSelected = dStr === currentSelectedDateKey;

        const cell = document.createElement('div');
        cell.className = `h-14 p-1 rounded-xl flex flex-col justify-between border cursor-pointer transition-all ${
          isSelected 
            ? 'border-rose-500 bg-rose-50/50 shadow-sm ring-1 ring-rose-400' 
            : isToday 
              ? 'border-blue-400 bg-blue-50/30' 
              : 'border-gray-100 bg-white hover:bg-gray-50'
        }`;

        const dateNum = document.createElement('div');
        dateNum.className = `text-[11px] font-bold ${isToday ? 'text-blue-600' : 'text-gray-700'}`;
        dateNum.textContent = day;
        cell.appendChild(dateNum);

        const dotsWrap = document.createElement('div');
        dotsWrap.className = 'flex flex-wrap gap-1 overflow-hidden max-h-7 content-start';

        const maxDots = 6;
        dayLogs.slice(0, maxDots).forEach(log => {
          const m = MODES[log.type] || MODES.work;
          const miniDot = document.createElement('span');
          miniDot.className = `w-1.5 h-1.5 rounded-full ${m.dotBg}`;
          dotsWrap.appendChild(miniDot);
        });

        if (dayLogs.length > maxDots) {
          const plus = document.createElement('span');
          plus.className = 'text-[9px] font-bold text-gray-400 leading-none';
          plus.textContent = `+${dayLogs.length - maxDots}`;
          dotsWrap.appendChild(plus);
        }

        cell.appendChild(dotsWrap);

        cell.addEventListener('click', () => {
          currentSelectedDateKey = dStr;
          renderCalendar();
          showSelectedDayDetails(dStr, dayLogs);
        });

        calendarGrid.appendChild(cell);
      }

      const initialLogs = logMap[currentSelectedDateKey] || [];
      showSelectedDayDetails(currentSelectedDateKey, initialLogs);
    }

    function showSelectedDayDetails(dateKey, logs) {
      selectedDateTitle.textContent = `${dateKey} の実績`;
      selectedDateDots.innerHTML = '';

      if (!logs || logs.length === 0) {
        selectedDateTotal.textContent = '合計: 0回';
        selectedDateDots.innerHTML = '<span class="text-[11px] text-gray-400">この日のポモドーロ履歴はありません</span>';
        return;
      }

      let workCount = 0;
      let totalMinutes = 0;

      logs.forEach(log => {
        const m = MODES[log.type] || MODES.work;
        if (log.type === 'work') {
          workCount++;
          totalMinutes += log.durationMinutes || 25;
        }

        const dot = document.createElement('div');
        const formattedTime = new Date(log.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        dot.className = `px-2 py-1 rounded-lg text-[10px] font-semibold flex items-center gap-1.5 ${m.dotBg} text-white shadow-xs`;
        dot.innerHTML = `
          <span>${m.name}</span>
          <span class="opacity-80 text-[9px]">${formattedTime}</span>
        `;
        selectedDateDots.appendChild(dot);
      });

      selectedDateTotal.textContent = `作業 ${workCount}回 (${totalMinutes}分)`;
    }

    const settingsModal = document.getElementById('settingsModal');
    const settingsModalContent = document.getElementById('settingsModalContent');
    const btnOpenSettingsModal = document.getElementById('btnOpenSettingsModal');
    const btnCloseSettingsModal = document.getElementById('btnCloseSettingsModal');
    const btnCancelSettings = document.getElementById('btnCancelSettings');
    const btnSaveSettings = document.getElementById('btnSaveSettings');
    const setsInput = document.getElementById('setsInput');

    function openSettingsModal() {
      setsInput.value = targetWorkSets;
      settingsModal.classList.remove('hidden');
      setTimeout(() => {
        settingsModal.classList.remove('opacity-0');
        settingsModalContent.classList.remove('translate-y-full');
      }, 10);
    }

    function hideSettingsModal() {
      settingsModal.classList.add('opacity-0');
      settingsModalContent.classList.add('translate-y-full');
      setTimeout(() => {
        settingsModal.classList.add('hidden');
      }, 200);
    }

    btnOpenSettingsModal.addEventListener('click', openSettingsModal);
    btnCloseSettingsModal.addEventListener('click', hideSettingsModal);
    btnCancelSettings.addEventListener('click', hideSettingsModal);
    settingsModal.addEventListener('click', (e) => {
      if (e.target === settingsModal) hideSettingsModal();
    });

    btnSaveSettings.addEventListener('click', async () => {
      const val = parseInt(setsInput.value, 10);
      if (isNaN(val) || val < 1 || val > 16) {
        showToast('セット数は1〜16の範囲で指定してください');
        return;
      }
      targetWorkSets = val;
      await saveSetting('targetWorkSets', targetWorkSets);
      updateCycleDisplay();
      hideSettingsModal();
    });

    window.addEventListener('DOMContentLoaded', async () => {
      lucide.createIcons();
      await initDB();
      targetWorkSets = await getSetting('targetWorkSets', 4);
      updateTimerDisplay();
      updateCycleDisplay();
      await renderTodayDots();
    });
  </script>
</body>
</html>
