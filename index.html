  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FocusTimer">
  
  <link rel="manifest" href='data:application/manifest+json,{"name":"FocusTimer","short_name":"FocusTimer","start_url":".","display":"standalone","background_color":"#F2F2F7","theme_color":"#007AFF","icons":[{"src":"data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22 width=%22192%22 height=%22192%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%23007AFF%22/><text x=%2250%25%22 y=%2255%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-size=%22100%22 fill=%22white%22>⏱</text></svg>","sizes":"192x192","type":"image/svg+xml"}]}'>

    :root {
      --system-bg: #F2F2F7;
      --card-bg: #FFFFFF;
      --accent: #007AFF;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: var(--system-bg);
      color: #1C1C1E;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    .touch-target {
      min-height: 44px;
      min-width: 44px;
    }
    .ios-backdrop {
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    @keyframes dotPop {
      0% { transform: scale(0); opacity: 0; }
      70% { transform: scale(1.3); }
      100% { transform: scale(1); opacity: 1; }
    }
    .dot-enter {
      animation: dotPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-3 sm:p-4 relative">

          <button type="button" id="btnSaveSettings" class="touch-target flex-1 py-2.5 rounded-xl bg-rose-500 text-sm font-medium text-white hover:bg-rose-600 active:scale-98 transition-all">保存</button>

  <script>
    const DB_NAME = 'FocusTimerDB';
    const DB_VERSION = 3;
    const LOGS_STORE = 'pomodoro_logs';
    const SETTINGS_STORE = 'settings';
    let db = null;

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains(LOGS_STORE)) {
            const store = database.createObjectStore(LOGS_STORE, { keyPath: 'id' });
            store.createIndex('dateKey', 'dateKey', { unique: false });
          }
          if (!database.objectStoreNames.contains(SETTINGS_STORE)) {
            database.createObjectStore(SETTINGS_STORE, { keyPath: 'key' });
          }
        };
        request.onsuccess = (e) => {
          db = e.target.result;
          resolve(db);
        };
        request.onerror = (e) => {
          showToast('IndexedDB接続失敗');
          reject(e.target.error);
        };
      });
    }

    function addPomodoroLog(log) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(LOGS_STORE, 'readwrite');
        const store = tx.objectStore(LOGS_STORE);
        const req = store.add(log);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    function getLogsByDate(dateKey) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(LOGS_STORE, 'readonly');
        const store = tx.objectStore(LOGS_STORE);
        const index = store.index('dateKey');
        const req = index.getAll(dateKey);
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    }

    function getLogsForMonth(year, month) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(LOGS_STORE, 'readonly');
        const store = tx.objectStore(LOGS_STORE);
        const req = store.getAll();
        req.onsuccess = () => {
          const prefix = `${year}-${String(month + 1).padStart(2, '0')}`;
          const filtered = (req.result || []).filter(item => item.dateKey.startsWith(prefix));
          resolve(filtered);
        };
        req.onerror = () => reject(req.error);
      });
    }

    function getSetting(key, defaultValue) {
      return new Promise((resolve) => {
        try {
          const tx = db.transaction(SETTINGS_STORE, 'readonly');
          const store = tx.objectStore(SETTINGS_STORE);
          const req = store.get(key);
          req.onsuccess = () => resolve(req.result ? req.result.value : defaultValue);
          req.onerror = () => resolve(defaultValue);
        } catch (e) {
          resolve(defaultValue);
        }
      });
    }

    function saveSetting(key, value) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(SETTINGS_STORE, 'readwrite');
        const store = tx.objectStore(SETTINGS_STORE);
        const req = store.put({ key, value });
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    let toastTimeout = null;
    function showToast(msg) {
      const toast = document.getElementById('toastNotification');
      const toastMsg = document.getElementById('toastMessage');
      toastMsg.textContent = msg;
      
      toast.classList.remove('-translate-y-16', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('-translate-y-16', 'opacity-0');
        toast.classList.remove('translate-y-0', 'opacity-100');
      }, 3000);
    }

    function getLocalDateKey(d = new Date()) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    /* ==========================================================
       スマホ・PWA対応：Web Audio API シングルトン ＆ アンロック処理
       ========================================================== */
    let globalAudioCtx = null;
    let isAudioUnlocked = false;

    function getAudioContext() {
      if (!globalAudioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          globalAudioCtx = new AudioCtx();
        }
      }
      return globalAudioCtx;
    }

    // 画面タップ等のユーザー操作時に呼び出し、ブラウザの音声制限を解除する
    function unlockAudioContext() {
      const ctx = getAudioContext();
      if (!ctx) return;

      if (ctx.state === 'suspended') {
        ctx.resume();
      }

      if (!isAudioUnlocked) {
        try {
          // 極小の無音バッファを再生してiOSのオーディオパイプラインを起動
          const buffer = ctx.createBuffer(1, 1, 22050);
          const source = ctx.createBufferSource();
          source.buffer = buffer;
          source.connect(ctx.destination);
          source.start(0);
          isAudioUnlocked = true;
        } catch (e) {
          console.warn('Audio unlock warning:', e);
        }
      }
    }

    // 最初のユーザー操作（タッチまたはクリック）でオーディオをアンロック
    ['touchstart', 'touchend', 'click', 'keydown'].forEach(evt => {
      document.addEventListener(evt, unlockAudioContext, { once: true, passive: true });
    });

    let selectedSoundType = 'beep';
    let selectedSoundVolume = 2;

    const VOLUME_FACTORS = {
      1: 0.20,
      2: 0.50,
      3: 0.90
    };

    /**
     * サウンド再生関数（アンロック済みコンテキストを再利用）
     */
    function playAlarmSound(type = selectedSoundType, volumeLevel = selectedSoundVolume) {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;

        if (ctx.state === 'suspended') {
          ctx.resume();
        }

        // スマホ用バイブレーション連動（対応ブラウザのみ）
        if ('vibrate' in navigator) {
          navigator.vibrate([200, 100, 200, 100, 400]);
        }

        const masterGain = ctx.createGain();
        const baseVol = VOLUME_FACTORS[volumeLevel] || 0.50;
        masterGain.gain.setValueAtTime(baseVol, ctx.currentTime);
        masterGain.connect(ctx.destination);

        const now = ctx.currentTime;

        if (type === 'beep') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';

          osc.frequency.setValueAtTime(880, now);
          osc.frequency.setValueAtTime(1174.66, now + 0.12);

          gain.gain.setValueAtTime(1, now);
          gain.gain.setValueAtTime(0.01, now + 0.1);
          gain.gain.setValueAtTime(1, now + 0.12);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);

          osc.connect(gain);
          gain.connect(masterGain);
          osc.start(now);
          osc.stop(now + 0.55);

        } else if (type === 'chime') {
          const freqs = [523.25, 659.25, 783.99, 1046.50];
          freqs.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + (idx * 0.08));

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.setValueAtTime(0.4, now + (idx * 0.08));
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);

            osc.connect(gain);
            gain.connect(masterGain);
            osc.start(now + (idx * 0.08));
            osc.stop(now + 1.3);
          });

        } else if (type === 'marimba') {
          const notes = [440, 659.25, 880];
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + (idx * 0.1));

            gain.gain.setValueAtTime(0.8, now + (idx * 0.1));
            gain.gain.exponentialRampToValueAtTime(0.001, now + (idx * 0.1) + 0.25);

            osc.connect(gain);
            gain.connect(masterGain);
            osc.start(now + (idx * 0.1));
            osc.stop(now + (idx * 0.1) + 0.3);
          });
        }
      } catch (err) {
        console.warn('Audio Play Error:', err);
      }
    }

    const workerBlobCode = `
      let timer = null;
      self.onmessage = function(e) {
        if (e.data === 'start') {
          if (!timer) {
            timer = setInterval(() => postMessage('tick'), 1000);
          }
        } else if (e.data === 'stop') {
          if (timer) {
            clearInterval(timer);
            timer = null;
          }
        }
      };
    `;
    const workerBlob = new Blob([workerBlobCode], { type: 'application/javascript' });
    const timerWorker = new Worker(URL.createObjectURL(workerBlob));

    const MODES = {
      work: { 
        name: '作業', 
        duration: 25 * 60,
        color: '#FF2D55', 
        dotBg: 'bg-rose-500'
      },
      short: { 
        name: '休憩', 
        duration: 5 * 60,
        color: '#34C759', 
        dotBg: 'bg-emerald-400'
      }
    };

    let currentMode = 'work';
    let timeLeft = MODES.work.duration;
    let targetEndTime = null;
    let isRunning = false;

    const CIRCLE_CIRCUMFERENCE = 2 * Math.PI * 45;

    const timeDisplay = document.getElementById('timeDisplay');
    const endTimeDisplay = document.getElementById('endTimeDisplay');
    const timerProgress = document.getElementById('timerProgress');
    const btnToggle = document.getElementById('btnToggle');
    const toggleIcon = document.getElementById('toggleIcon');
    const toggleText = document.getElementById('toggleText');
    const btnReset = document.getElementById('btnReset');
    const btnSkip = document.getElementById('btnSkip');

    const btnModeWork = document.getElementById('btnModeWork');
    const btnModeBreak = document.getElementById('btnModeBreak');
    const todayDotsContainer = document.getElementById('todayDotsContainer');
    const todaySummaryStats = document.getElementById('todaySummaryStats');

    function updateTimerDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      timeDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      
      const total = MODES[currentMode].duration;
      const fraction = timeLeft / total;
      const offset = CIRCLE_CIRCUMFERENCE * (1 - fraction);
      timerProgress.style.strokeDashoffset = offset;

      const endTimestamp = isRunning && targetEndTime ? targetEndTime : Date.now() + timeLeft * 1000;
      const endObj = new Date(endTimestamp);
      const endH = String(endObj.getHours()).padStart(2, '0');
      const endM = String(endObj.getMinutes()).padStart(2, '0');
      endTimeDisplay.textContent = `${endH}:${endM} 終了`;
    }

    function setMode(mode, autoStart = false) {
      if (isRunning && !autoStart) toggleTimer();
      currentMode = mode;
      timeLeft = MODES[mode].duration;
      targetEndTime = null;

      timerProgress.setAttribute('stroke', MODES[mode].color);
      
      if (mode === 'work') {
        btnToggle.className = 'touch-target px-9 py-3.5 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-full shadow-lg shadow-rose-200 active:scale-95 transition-all flex items-center gap-2';
        btnModeWork.className = 'flex-1 py-1.5 text-xs font-semibold rounded-full bg-white shadow-sm text-gray-900 transition-all touch-target';
        btnModeBreak.className = 'flex-1 py-1.5 text-xs font-semibold rounded-full text-gray-500 hover:text-gray-900 transition-all touch-target';
      } else {
        btnToggle.className = 'touch-target px-9 py-3.5 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-full shadow-lg shadow-emerald-200 active:scale-95 transition-all flex items-center gap-2';
        btnModeBreak.className = 'flex-1 py-1.5 text-xs font-semibold rounded-full bg-white shadow-sm text-gray-900 transition-all touch-target';
        btnModeWork.className = 'flex-1 py-1.5 text-xs font-semibold rounded-full text-gray-500 hover:text-gray-900 transition-all touch-target';
      }
      
      updateTimerDisplay();

      if (autoStart) {
        startTimer();
      }
    }

    function startTimer() {
      unlockAudioContext(); // タイマー開始操作時に確実にアンロック
      isRunning = true;
      targetEndTime = Date.now() + timeLeft * 1000;
      toggleText.textContent = '一時停止';
      toggleIcon.setAttribute('data-lucide', 'pause');
      timerWorker.postMessage('start');
      lucide.createIcons();
      updateTimerDisplay();
    }

    function pauseTimer() {
      timerWorker.postMessage('stop');
      isRunning = false;
      targetEndTime = null;
      toggleText.textContent = 'スタート';
      toggleIcon.setAttribute('data-lucide', 'play');
      lucide.createIcons();
      updateTimerDisplay();
    }

    async function onTimerComplete() {
      playAlarmSound();

      const finishedMode = currentMode;
      const newLog = {
        id: 'log_' + Date.now(),
        type: finishedMode,
        durationMinutes: Math.round(MODES[finishedMode].duration / 60),
        timestamp: Date.now(),
        dateKey: getLocalDateKey()
      };
      await addPomodoroLog(newLog);

      await renderTodayDots();
      if (currentView === 'calendar') {
        await renderCalendar();
      }

      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification('FocusTimer', {
          body: `${MODES[finishedMode].name}が終了しました。次のタイマーを自動スタートします。`,
          icon: 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22 width=%22192%22 height=%22192%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%23FF2D55%22/><text x=%2250%25%22 y=%2255%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-size=%22100%22 fill=%22white%22>⏱</text></svg>'
        });
      }

      if (finishedMode === 'work') {
        showToast('作業完了！休憩を自動開始しました');
        setMode('short', true);
      } else {
        showToast('休憩終了！作業を自動開始しました');
        setMode('work', true);
      }
    }

    function tickTimer() {
      if (!isRunning || !targetEndTime) return;
      const remainingMs = targetEndTime - Date.now();
      if (remainingMs <= 0) {
        timeLeft = 0;
        updateTimerDisplay();
        onTimerComplete();
      } else {
        timeLeft = Math.ceil(remainingMs / 1000);
        updateTimerDisplay();
      }
    }

    timerWorker.onmessage = (e) => {
      if (e.data === 'tick') tickTimer();
    };

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && isRunning && targetEndTime) {
        tickTimer();
      }
    });

    function toggleTimer() {
      unlockAudioContext();
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }

      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    btnToggle.addEventListener('click', toggleTimer);
    btnReset.addEventListener('click', () => {
      unlockAudioContext();
      if (isRunning) pauseTimer();
      timeLeft = MODES[currentMode].duration;
      targetEndTime = null;
      updateTimerDisplay();
    });
    btnSkip.addEventListener('click', () => {
      unlockAudioContext();
      const wasRunning = isRunning;
      if (currentMode === 'work') {
        setMode('short', wasRunning);
      } else {
        setMode('work', wasRunning);
      }
    });

    btnModeWork.addEventListener('click', () => {
      unlockAudioContext();
      setMode('work');
    });
    btnModeBreak.addEventListener('click', () => {
      unlockAudioContext();
      setMode('short');
    });

    async function renderTodayDots() {
      const todayKey = getLocalDateKey();
      const logs = await getLogsByDate(todayKey);

      todayDotsContainer.innerHTML = '';

      if (logs.length === 0) {
        todayDotsContainer.innerHTML = `
          <div class="w-full text-center py-2 text-xs text-gray-400">
            今日の完了ドットはまだありません
          </div>
        `;
        todaySummaryStats.textContent = '作業 0回 (0分)';
        return;
      }

      let workCount = 0;
      let totalWorkMinutes = 0;

      logs.forEach((log) => {
        const modeInfo = MODES[log.type] || MODES.work;
        if (log.type === 'work') {
          workCount++;
          totalWorkMinutes += log.durationMinutes || 25;
        }

        const dot = document.createElement('div');
        const formattedTime = new Date(log.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        dot.className = `w-6 h-6 rounded-full ${modeInfo.dotBg} shadow-sm dot-enter cursor-pointer active:scale-75 transition-transform flex items-center justify-center text-[10px] text-white font-bold`;
        dot.title = `${modeInfo.name} (${formattedTime} 完了)`;
        
        if (log.type === 'work') {
          dot.innerHTML = `<span class="opacity-90">•</span>`;
        }

        dot.addEventListener('click', () => {
          showToast(`${modeInfo.name} (${formattedTime} 完了 / ${log.durationMinutes}分)`);
        });

        todayDotsContainer.appendChild(dot);
      });

      todaySummaryStats.textContent = `作業 ${workCount}回 (${totalWorkMinutes}分)`;
    }

    const viewTimer = document.getElementById('viewTimer');
    const viewCalendar = document.getElementById('viewCalendar');
    const navBtnTimer = document.getElementById('navBtnTimer');
    const navBtnCalendar = document.getElementById('navBtnCalendar');

    const calendarMonthYear = document.getElementById('calendarMonthYear');
    const calendarGrid = document.getElementById('calendarGrid');
    const btnPrevMonth = document.getElementById('btnPrevMonth');
    const btnNextMonth = document.getElementById('btnNextMonth');

    const selectedDateTitle = document.getElementById('selectedDateTitle');
    const selectedDateTotal = document.getElementById('selectedDateTotal');
    const selectedDateDots = document.getElementById('selectedDateDots');

    let currentView = 'timer';
    let calendarDate = new Date();
    let currentSelectedDateKey = getLocalDateKey();

    function switchView(view) {
      unlockAudioContext();
      currentView = view;
      if (view === 'timer') {
        viewTimer.classList.remove('hidden');
        viewCalendar.classList.add('hidden');
        navBtnTimer.className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all shadow-sm bg-white text-gray-900 flex items-center gap-1.5 touch-target';
        navBtnCalendar.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-600 hover:text-gray-900 transition-all flex items-center gap-1.5 touch-target';
      } else {
        viewTimer.classList.add('hidden');
        viewCalendar.classList.remove('hidden');
        navBtnCalendar.className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all shadow-sm bg-white text-gray-900 flex items-center gap-1.5 touch-target';
        navBtnTimer.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-600 hover:text-gray-900 transition-all flex items-center gap-1.5 touch-target';
        renderCalendar();
      }
      lucide.createIcons();
    }

    navBtnTimer.addEventListener('click', () => switchView('timer'));
    navBtnCalendar.addEventListener('click', () => switchView('calendar'));

    btnPrevMonth.addEventListener('click', () => {
      calendarDate.setMonth(calendarDate.getMonth() - 1);
      renderCalendar();
    });
    btnNextMonth.addEventListener('click', () => {
      calendarDate.setMonth(calendarDate.getMonth() + 1);
      renderCalendar();
    });

    async function renderCalendar() {
      const year = calendarDate.getFullYear();
      const month = calendarDate.getMonth();
      
      calendarMonthYear.textContent = `${year}年 ${month + 1}月`;

      const monthLogs = await getLogsForMonth(year, month);
      
      const logMap = {};
      monthLogs.forEach(log => {
        if (!logMap[log.dateKey]) logMap[log.dateKey] = [];
        logMap[log.dateKey].push(log);
      });

      calendarGrid.innerHTML = '';

      const firstDayIndex = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDayIndex; i++) {
        const blank = document.createElement('div');
        blank.className = 'h-14 rounded-xl bg-gray-50/40 opacity-30';
        calendarGrid.appendChild(blank);
      }

      const todayStr = getLocalDateKey();

      for (let day = 1; day <= lastDate; day++) {
        const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayLogs = logMap[dStr] || [];
        const isToday = dStr === todayStr;
        const isSelected = dStr === currentSelectedDateKey;

        const cell = document.createElement('div');
        cell.className = `h-14 p-1 rounded-xl flex flex-col justify-between border cursor-pointer transition-all ${
          isSelected 
            ? 'border-rose-500 bg-rose-50/50 shadow-sm ring-1 ring-rose-400' 
            : isToday 
              ? 'border-blue-400 bg-blue-50/30' 
              : 'border-gray-100 bg-white hover:bg-gray-50'
        }`;

        const dateNum = document.createElement('div');
        dateNum.className = `text-[11px] font-bold ${isToday ? 'text-blue-600' : 'text-gray-700'}`;
        dateNum.textContent = day;
        cell.appendChild(dateNum);

        const dotsWrap = document.createElement('div');
        dotsWrap.className = 'flex flex-wrap gap-1 overflow-hidden max-h-7 content-start';

        const maxDots = 6;
        dayLogs.slice(0, maxDots).forEach(log => {
          const m = MODES[log.type] || MODES.work;
          const miniDot = document.createElement('span');
          miniDot.className = `w-1.5 h-1.5 rounded-full ${m.dotBg}`;
          dotsWrap.appendChild(miniDot);
        });

        if (dayLogs.length > maxDots) {
          const plus = document.createElement('span');
          plus.className = 'text-[9px] font-bold text-gray-400 leading-none';
          plus.textContent = `+${dayLogs.length - maxDots}`;
          dotsWrap.appendChild(plus);
        }

        cell.appendChild(dotsWrap);

        cell.addEventListener('click', () => {
          currentSelectedDateKey = dStr;
          renderCalendar();
          showSelectedDayDetails(dStr, dayLogs);
        });

        calendarGrid.appendChild(cell);
      }

      const initialLogs = logMap[currentSelectedDateKey] || [];
      showSelectedDayDetails(currentSelectedDateKey, initialLogs);
    }

    function showSelectedDayDetails(dateKey, logs) {
      selectedDateTitle.textContent = `${dateKey} の実績`;
      selectedDateDots.innerHTML = '';

      if (!logs || logs.length === 0) {
        selectedDateTotal.textContent = '合計: 0回';
        selectedDateDots.innerHTML = '<span class="text-[11px] text-gray-400">この日のポモドーロ履歴はありません</span>';
        return;
      }

      let workCount = 0;
      let totalMinutes = 0;

      logs.forEach(log => {
        const m = MODES[log.type] || MODES.work;
        if (log.type === 'work') {
          workCount++;
          totalMinutes += log.durationMinutes || 25;
        }

        const dot = document.createElement('div');
        const formattedTime = new Date(log.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        dot.className = `px-2 py-1 rounded-lg text-[10px] font-semibold flex items-center gap-1.5 ${m.dotBg} text-white shadow-xs`;
        dot.innerHTML = `
          <span>${m.name}</span>
          <span class="opacity-80 text-[9px]">${formattedTime}</span>
        `;
        selectedDateDots.appendChild(dot);
      });

      selectedDateTotal.textContent = `作業 ${workCount}回 (${totalMinutes}分)`;
    }

    /* 設定モーダル関連ロジック */
    const settingsModal = document.getElementById('settingsModal');
    const settingsModalContent = document.getElementById('settingsModalContent');
    const btnOpenSettingsModal = document.getElementById('btnOpenSettingsModal');
    const btnCloseSettingsModal = document.getElementById('btnCloseSettingsModal');
    const btnCancelSettings = document.getElementById('btnCancelSettings');
    const btnSaveSettings = document.getElementById('btnSaveSettings');
    const btnPreviewSound = document.getElementById('btnPreviewSound');

    let tempSoundType = 'beep';
    let tempVolumeLevel = 2;

    function updateSoundSelectionUI() {
      document.querySelectorAll('#soundSelectGroup .sound-opt-btn').forEach(btn => {
        const snd = btn.getAttribute('data-sound');
        if (snd === tempSoundType) {
          btn.className = 'sound-opt-btn py-2.5 px-2 rounded-xl border text-xs font-semibold flex flex-col items-center gap-1 transition-all border-rose-500 bg-rose-50/60 text-rose-600 shadow-sm';
        } else {
          btn.className = 'sound-opt-btn py-2.5 px-2 rounded-xl border text-xs font-semibold flex flex-col items-center gap-1 transition-all border-gray-200 text-gray-600 hover:bg-gray-50';
        }
      });

      document.querySelectorAll('#volumeSelectGroup .vol-opt-btn').forEach(btn => {
        const vol = parseInt(btn.getAttribute('data-volume'), 10);
        if (vol === tempVolumeLevel) {
          btn.className = 'vol-opt-btn flex-1 py-2 text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-1 bg-white text-gray-900 shadow-sm';
        } else {
          btn.className = 'vol-opt-btn flex-1 py-2 text-xs font-semibold rounded-lg transition-all flex items-center justify-center gap-1 text-gray-500 hover:text-gray-900';
        }
      });
      lucide.createIcons();
    }

    document.querySelectorAll('#soundSelectGroup .sound-opt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        unlockAudioContext();
        tempSoundType = btn.getAttribute('data-sound');
        updateSoundSelectionUI();
        playAlarmSound(tempSoundType, tempVolumeLevel);
      });
    });

    document.querySelectorAll('#volumeSelectGroup .vol-opt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        unlockAudioContext();
        tempVolumeLevel = parseInt(btn.getAttribute('data-volume'), 10);
        updateSoundSelectionUI();
        playAlarmSound(tempSoundType, tempVolumeLevel);
      });
    });

    btnPreviewSound.addEventListener('click', () => {
      unlockAudioContext();
      playAlarmSound(tempSoundType, tempVolumeLevel);
    });

    function openSettingsModal() {
      unlockAudioContext();
      tempSoundType = selectedSoundType;
      tempVolumeLevel = selectedSoundVolume;
      updateSoundSelectionUI();

      settingsModal.classList.remove('hidden');
      setTimeout(() => {
        settingsModal.classList.remove('opacity-0');
        settingsModalContent.classList.remove('translate-y-full');
      }, 10);
    }

    function hideSettingsModal() {
      settingsModal.classList.add('opacity-0');
      settingsModalContent.classList.add('translate-y-full');
      setTimeout(() => {
        settingsModal.classList.add('hidden');
      }, 200);
    }

    btnOpenSettingsModal.addEventListener('click', openSettingsModal);
    btnCloseSettingsModal.addEventListener('click', hideSettingsModal);
    btnCancelSettings.addEventListener('click', hideSettingsModal);
    settingsModal.addEventListener('click', (e) => {
      if (e.target === settingsModal) hideSettingsModal();
    });

    btnSaveSettings.addEventListener('click', async () => {
      selectedSoundType = tempSoundType;
      selectedSoundVolume = tempVolumeLevel;

      await saveSetting('alarmSoundType', selectedSoundType);
      await saveSetting('alarmSoundVolume', selectedSoundVolume);

      hideSettingsModal();
      showToast('設定を保存しました');
    });

    window.addEventListener('DOMContentLoaded', async () => {
      lucide.createIcons();
      await initDB();
      selectedSoundType = await getSetting('alarmSoundType', 'beep');
      selectedSoundVolume = await getSetting('alarmSoundVolume', 2);

      updateTimerDisplay();
      await renderTodayDots();
    });
  </script>
</body>
</html>
